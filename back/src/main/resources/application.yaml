spring:
  application:
    name: portfolio-back

server:
  # The host sets PORT; 8080 when it is absent.
  port: ${PORT:8080}
  # Forwarding headers are never trusted: a visitor can forge them.
  forward-headers-strategy: none
  tomcat:
    threads:
      max: 20

# Actuator is reduced to the health indicator, which answers {"status":"UP"} only.
management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health
      # Closes the discovery page served on /actuator.
      discovery:
        enabled: false
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never
      # Spring Boot 4 adds the liveness and readiness groups by default.
      probes:
        enabled: false
  health:
    # Not meaningful on the host's ephemeral disk.
    diskspace:
      enabled: false

contact:
  # Exact origins accepted for browser calls to /api/v1/, comma-separated: scheme http or https,
  # host, optional port; no path, trailing slash or wildcard. Empty: no browser origin.
  allowed-origins: ${CONTACT_ALLOWED_ORIGINS:}
  # Message sender: brevo, the provider, or none, which sends nothing (development, AOT training).
  # brevo by default, so that a forgotten setting never loses messages in silence.
  mail-sender: ${CONTACT_MAIL_SENDER:brevo}
