# Contrôles de chaque PR vers staging et main (TK-07). Les deux travaux tournent sur chaque PR,
# sans filtre de chemins : un contrôle exigé avant fusion, mais sauté, resterait en attente.
# Aucun secret : le déploiement passe par l'intégration Git des hébergeurs (CT-09).
name: CI

on:
  pull_request:
    branches: [staging, main]

permissions:
  contents: read

jobs:
  front:
    name: front
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: front/.nvmrc
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --watch=false
      - run: npm run i18n:verifier
      - run: npm run build

  back:
    name: back
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw -B -ntp verify
      # L'image du back (TK-14) se construit sur chaque PR, sans être publiée : la publication
      # n'a lieu qu'aux tags (publish-back-image.yml).
      - run: docker build -t portfolio-back:ci .
