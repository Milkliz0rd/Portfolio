# Contrôles de chaque PR et de chaque push vers staging et main (TK-07). Seulement ce qui ne peut
# pas échouer pour une raison extérieure : installations verrouillées, analyses, tests unitaires,
# contrôle du contenu, builds et image du back. Le banc de bout en bout, dans les navigateurs,
# tourne à la demande (e2e.yml). Les travaux tournent à chaque fois, sans filtre de chemins : un
# contrôle exigé avant fusion, mais sauté, resterait en attente. Aucun secret : le déploiement
# passe par l'intégration Git des hébergeurs (CT-09).
name: CI

on:
  pull_request:
    branches: [staging, main]
  # Render ne déploie le back qu'une fois passés les contrôles du nouveau commit de sa branche, et
  # jamais un commit sans contrôles (autoDeployTrigger: checksPass, back/render.yaml) : le commit
  # de fusion reçoit ici ses propres front et back, que pull_request seul ne lance pas. La
  # branche d'une PR n'est ni staging ni main : ses contrôles tournent toujours une seule fois.
  push:
    branches: [staging, main]

permissions:
  contents: read

# Un seul passage à la fois par PR : un nouveau push annule le précédent. Chaque push vers staging
# ou main garde le sien (son groupe est son commit), que Render attend avant de déployer.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-{0}', github.sha) }}
  cancel-in-progress: true

jobs:
  front:
    name: front
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: front/.nvmrc
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      # Contrôle du contenu (TK-28) : mode main sur une PR vers main ou un push sur main, où un
      # emplacement étiqueté bloque ; mode staging ailleurs, où il ne fait qu'avertir.
      - run: npm run controle-contenu -- --mode=${{ (github.base_ref || github.ref_name) == 'main' && 'main' || 'staging' }}
      - run: npm run lint
      - run: npm test -- --watch=false
      - run: npm run i18n:verifier
      - run: npm run build

  back:
    name: back
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # setup-java garde Maven lui-même (cache maven-wrapper) ; sans ce cache (nouvelle version,
      # cache expiré), le wrapper le télécharge depuis Maven Central, qui refuse parfois (HTTP
      # 429) : trois essais espacés, avant les contrôles.
      - run: for essai in 1 2 3; do ./mvnw -B -ntp --version && exit 0; sleep 30; done; exit 1
      - run: ./mvnw -B -ntp verify
      # L'image du back (TK-14) se construit sur chaque PR, sans être publiée : la publication
      # n'a lieu qu'aux tags (publish-back-image.yml). Les couches sont gardées dans le cache de
      # GitHub : celle de Maven et des dépendances (dependency:go-offline) ne se refait que si le
      # wrapper ou le pom change, sans retélécharger depuis Maven Central à chaque passage.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: back
          push: false
          tags: portfolio-back:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
