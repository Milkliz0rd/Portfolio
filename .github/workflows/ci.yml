# Contrôles de chaque PR et de chaque push vers staging et main (TK-07). Les travaux tournent à
# chaque fois, sans filtre de chemins : un contrôle exigé avant fusion, mais sauté, resterait en
# attente. Aucun secret : le déploiement passe par l'intégration Git des hébergeurs (CT-09).
name: CI

on:
  pull_request:
    branches: [staging, main]
  # Render ne déploie le back qu'une fois passés les contrôles du nouveau commit de sa branche, et
  # jamais un commit sans contrôles (autoDeployTrigger: checksPass, back/render.yaml) : le commit
  # de fusion reçoit ici ses propres front, back et e2e, que pull_request seul ne lance pas. La
  # branche d'une PR n'est ni staging ni main : ses contrôles tournent toujours une seule fois.
  push:
    branches: [staging, main]

permissions:
  contents: read

jobs:
  front:
    name: front
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: front/.nvmrc
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      # Contrôle du contenu (TK-28) : mode main sur une PR vers main ou un push sur main, où un
      # emplacement étiqueté bloque ; mode staging ailleurs, où il ne fait qu'avertir.
      - run: npm run controle-contenu -- --mode=${{ (github.base_ref || github.ref_name) == 'main' && 'main' || 'staging' }}
      - run: npm run lint
      - run: npm test -- --watch=false
      - run: npm run i18n:verifier
      - run: npm run build

  back:
    name: back
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw -B -ntp verify
      # L'image du back (TK-14) se construit sur chaque PR, sans être publiée : la publication
      # n'a lieu qu'aux tags (publish-back-image.yml).
      - run: docker build -t portfolio-back:ci .

  # Banc de bout en bout et d'accessibilité du front (TK-21) : le build de test servi par
  # wrangler dev, dans les six profils. Sur échec, le rapport de Playwright reste en artefact.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: front/.nvmrc
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      # Les navigateurs de la version de Playwright du lockfile, avec leurs bibliothèques système.
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: front/playwright-report/
          retention-days: 14
